<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Gastos</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; color: #333; }
  .container { max-width: 800px; margin: 0 auto; padding: 12px; background: #fff; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 20px; border-radius: 10px; margin-bottom: 16px; }
  .header h1 { font-size: 22px; }
  .header small { opacity: .85; font-size: 13px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 2px solid #eee; overflow-x: auto; }
  .tab { padding: 10px 14px; border: none; background: none; cursor: pointer; font-size: 15px; color: #999; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.active { color: #667eea; border-bottom-color: #667eea; font-weight: 600; }
  .field { margin-bottom: 14px; }
  .field label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; font-family: inherit; }
  .field textarea { resize: vertical; min-height: 60px; }
  .btn { background: #667eea; color: #fff; padding: 11px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; width: 100%; margin-top: 4px; }
  .btn:hover { background: #5568d3; }
  .btn-sec { background: #888; }
  .btn-sec:hover { background: #666; }
  .btn-danger { background: #ff6b6b; }
  .btn-danger:hover { background: #ff5252; }
  .btn-small { width: auto; padding: 7px 12px; font-size: 13px; margin: 0; }
  .row { background: #f9f9f9; padding: 12px 14px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .row-info { flex: 1; min-width: 0; }
  .row-title { font-weight: 600; }
  .row-sub { font-size: 12px; color: #888; margin-top: 2px; }
  .amount { font-size: 17px; font-weight: 700; color: #667eea; }
  .actions { display: flex; gap: 6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 16px; border-radius: 10px; text-align: center; }
  .card h3 { font-size: 12px; opacity: .85; font-weight: 500; margin-bottom: 6px; }
  .card .value { font-size: 24px; font-weight: 700; }
  .bar { height: 8px; background: #e5e5e5; border-radius: 6px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: #667eea; }
  .bar > div.over { background: #ff6b6b; }
  .msg { padding: 12px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; }
  .msg.ok { background: #e0ffe6; color: #13803a; }
  .msg.err { background: #ffe0e0; color: #c62828; }
  .msg.warn { background: #fff4d6; color: #8a6100; }
  .msg .btn { margin-top: 8px; }
  .section-title { margin: 22px 0 10px; font-size: 17px; }
  .muted { color: #888; font-size: 13px; }
  .empty { text-align: center; color: #999; padding: 30px; }
  .sep { border-top: 1px solid #eee; margin: 22px 0; }
  @media (max-width: 600px) { .header h1 { font-size: 19px; } .tab { font-size: 14px; padding: 9px 10px; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = 'gastos-app-data-v2';
const LAST_BACKUP_KEY = 'gastos-app-last-backup';

const DEFAULT_CATEGORIES = [
  { id: 'c1', name: 'Ocio', budget: 300 },
  { id: 'c2', name: 'Gasolina', budget: 100 },
  { id: 'c3', name: 'Inglés', budget: 100 },
  { id: 'c4', name: 'Tabaco/café', budget: 50 },
  { id: 'c5', name: 'Coche', budget: 600 },
  { id: 'c6', name: 'Viaje', budget: 200 },
  { id: 'c7', name: 'Ropa', budget: 210 },
  { id: 'c8', name: 'Préstamo', budget: 500 },
  { id: 'c9', name: 'Universidad', budget: 616 }
];

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const today = () => {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};

const monthOf = (dateStr) => String(dateStr).slice(0, 7);

const shiftMonth = (key, delta) => {
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
};

const parseAmount = (v) => parseFloat(String(v).replace(',', '.'));

const normalizeExpenses = (list) => list
  .map(x => ({
    id: x.id ? String(x.id) : newId(),
    amount: Number(x.amount ?? x.monto) || 0,
    category: String(x.category ?? x.categoria ?? 'Sin categoría'),
    note: String(x.note ?? x.nota ?? ''),
    date: String(x.date ?? x.fecha ?? today()).slice(0, 10)
  }))
  .filter(e => e.amount > 0);

const normalizeCategories = (list) => list.map(c => ({
  id: c.id ? String(c.id) : newId(),
  name: String(c.name),
  budget: Number(c.budget) || 0
}));

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return {
      expenses: Array.isArray(d.expenses) ? d.expenses : [],
      categories: Array.isArray(d.categories) && d.categories.length ? d.categories : DEFAULT_CATEGORIES
    };
  } catch (e) {
    return null;
  }
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { console.error(e); }
}

// Busca gastos y categorías guardados por versiones anteriores de la app en este navegador
function findLegacyData() {
  const res = { expenses: [], categories: [] };
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key === STORAGE_KEY) continue;
      let val;
      try { val = JSON.parse(localStorage.getItem(key)); } catch (e) { continue; }
      const lists = Array.isArray(val)
        ? [val]
        : (val && typeof val === 'object' ? Object.values(val).filter(Array.isArray) : []);
      lists.forEach(arr => {
        if (arr.length && arr.every(x => x && typeof x === 'object' && 'amount' in x && 'category' in x)) {
          res.expenses.push(...arr);
        }
        if (arr.length && arr.every(x => x && typeof x === 'object' && 'name' in x && 'budget' in x)) {
          res.categories.push(...arr);
        }
      });
    }
  } catch (e) { console.error(e); }
  return res;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function App() {
  const [data, setData] = useState(() => loadData() || { expenses: [], categories: DEFAULT_CATEGORIES });
  const [tab, setTab] = useState('home');
  const [msg, setMsg] = useState(null);
  const [legacy, setLegacy] = useState(null);
  const [lastBackup, setLastBackup] = useState(() => localStorage.getItem(LAST_BACKUP_KEY));
  const [form, setForm] = useState({ amount: '', category: '', note: '', date: today() });
  const [catForm, setCatForm] = useState({ id: null, name: '', budget: '' });
  const replaceInput = useRef(null);
  const mergeInput = useRef(null);

  useEffect(() => { saveData(data); }, [data]);

  useEffect(() => {
    if (data.expenses.length === 0) {
      const found = findLegacyData();
      if (found.expenses.length) setLegacy(found);
    }
  }, []);

  const notify = (text, type = 'ok') => {
    setMsg({ text, type });
    setTimeout(() => setMsg(null), 3500);
  };

  // ---------- Gastos ----------
  const addExpense = () => {
    const amount = parseAmount(form.amount);
    if (!isFinite(amount) || amount <= 0 || !form.category) {
      return notify('Pon un importe válido y una categoría', 'err');
    }
    setData(d => ({
      ...d,
      expenses: [{ id: newId(), amount, category: form.category, note: form.note.trim(), date: form.date }, ...d.expenses]
    }));
    setForm({ ...form, amount: '', note: '' });
    notify('Gasto añadido ✓');
  };

  const deleteExpense = (id) => {
    if (!confirm('¿Eliminar este gasto?')) return;
    setData(d => ({ ...d, expenses: d.expenses.filter(e => e.id !== id) }));
  };

  // ---------- Categorías ----------
  const saveCategory = () => {
    const name = catForm.name.trim();
    const budget = parseAmount(catForm.budget);
    if (!name || !isFinite(budget) || budget < 0) return notify('Pon nombre y presupuesto', 'err');
    if (data.categories.some(c => c.id !== catForm.id && c.name.toLowerCase() === name.toLowerCase())) {
      return notify('Ya existe una categoría con ese nombre', 'err');
    }
    setData(d => {
      const old = catForm.id ? d.categories.find(c => c.id === catForm.id) : null;
      const categories = old
        ? d.categories.map(c => c.id === catForm.id ? { ...c, name, budget } : c)
        : [...d.categories, { id: newId(), name, budget }];
      // Si se renombra, los gastos antiguos pasan al nuevo nombre
      const expenses = old && old.name !== name
        ? d.expenses.map(e => e.category === old.name ? { ...e, category: name } : e)
        : d.expenses;
      return { categories, expenses };
    });
    setCatForm({ id: null, name: '', budget: '' });
    notify('Categoría guardada ✓');
  };

  const deleteCategory = (cat) => {
    if (!confirm(`¿Eliminar la categoría "${cat.name}"? Sus gastos se conservan.`)) return;
    setData(d => ({ ...d, categories: d.categories.filter(c => c.id !== cat.id) }));
  };

  // ---------- Copia de seguridad ----------
  const exportBackup = () => {
    const payload = {
      app: 'gastos',
      version: 2,
      exportedAt: new Date().toISOString(),
      expenses: data.expenses,
      categories: data.categories
    };
    downloadBlob(
      new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }),
      `gastos-copia-${today()}.json`
    );
    const now = new Date().toISOString();
    localStorage.setItem(LAST_BACKUP_KEY, now);
    setLastBackup(now);
    notify('Copia descargada ✓. Guárdala en un lugar seguro.');
  };

  const importBackup = (file, replace) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const p = JSON.parse(reader.result);
        if (!p || !Array.isArray(p.expenses)) throw new Error('el archivo no es una copia válida');
        const incomingExp = normalizeExpenses(p.expenses);
        const incomingCat = Array.isArray(p.categories) ? normalizeCategories(p.categories) : [];
        setData(d => {
          if (replace) {
            return {
              expenses: incomingExp,
              categories: incomingCat.length ? incomingCat : d.categories
            };
          }
          const existingIds = new Set(d.expenses.map(e => e.id));
          const fresh = incomingExp.filter(e => !existingIds.has(e.id));
          const cats = [...d.categories];
          incomingCat.forEach(c => {
            if (!cats.some(x => x.name.toLowerCase() === c.name.toLowerCase())) cats.push(c);
          });
          return { expenses: [...fresh, ...d.expenses], categories: cats };
        });
        notify(`Copia importada: ${incomingExp.length} gastos`);
      } catch (e) {
        notify('No se pudo importar: ' + e.message, 'err');
      }
    };
    reader.readAsText(file);
  };

  const onPickFile = (e, replace) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (replace && !confirm('Esto sustituirá TODOS los datos actuales por los de la copia. ¿Continuar?')) return;
    importBackup(file, replace);
  };

  const importLegacy = () => {
    setData({
      expenses: normalizeExpenses(legacy.expenses),
      categories: legacy.categories.length ? normalizeCategories(legacy.categories) : DEFAULT_CATEGORIES
    });
    setLegacy(null);
    notify('Datos anteriores importados ✓');
  };

  const exportCSV = () => {
    let csv = 'Fecha,Categoría,Monto,Nota\n';
    data.expenses.forEach(e => {
      csv += `${e.date},"${e.category}",${e.amount},"${(e.note || '').replace(/"/g, '""')}"\n`;
    });
    downloadBlob(new Blob([csv], { type: 'text/csv' }), `gastos-${today()}.csv`);
  };

  // ---------- Estadísticas ----------
  const thisMonth = monthOf(today());
  const lastMonth = shiftMonth(thisMonth, -1);
  const totalFor = (k) => data.expenses.filter(e => monthOf(e.date) === k).reduce((s, e) => s + e.amount, 0);
  const spentByCat = (k) => data.expenses
    .filter(e => monthOf(e.date) === k)
    .reduce((acc, e) => { acc[e.category] = (acc[e.category] || 0) + e.amount; return acc; }, {});

  const totalNow = totalFor(thisMonth);
  const totalPrev = totalFor(lastMonth);
  const diff = totalPrev > 0 ? ((totalNow - totalPrev) / totalPrev) * 100 : null;

  const monthlyTotals = {};
  data.expenses.forEach(e => { const k = monthOf(e.date); monthlyTotals[k] = (monthlyTotals[k] || 0) + e.amount; });
  const monthKeys = Object.keys(monthlyTotals).sort().reverse().slice(0, 12);
  const maxMonth = Math.max(1, ...monthKeys.map(k => monthlyTotals[k]));

  const backupAgeDays = lastBackup ? (Date.now() - new Date(lastBackup).getTime()) / 864e5 : Infinity;
  const showReminder = data.expenses.length > 0 && backupAgeDays > 7;

  // ---------- Vistas ----------
  const tabs = [
    ['home', '➕ Inicio'],
    ['categories', '🏷️ Categorías'],
    ['stats', '📊 Estadísticas'],
    ['history', '📋 Historial'],
    ['backup', '💾 Copia']
  ];

  return (
    <div className="container">
      <div className="header">
        <h1>💰 Gestor de Gastos</h1>
        <small>{data.expenses.length} gastos guardados en este navegador</small>
      </div>

      {legacy && (
        <div className="msg warn">
          Hemos encontrado {legacy.expenses.length} gastos de una versión anterior en este navegador. ¿Quieres importarlos?
          <button className="btn" onClick={importLegacy}>Importar datos anteriores</button>
          <button className="btn btn-sec" onClick={() => setLegacy(null)}>No, gracias</button>
        </div>
      )}

      {showReminder && (
        <div className="msg warn">
          {lastBackup ? 'Hace más de una semana que no descargas una copia.' : 'Aún no has descargado ninguna copia de seguridad.'}
          {' '}Ve a la pestaña 💾 Copia para guardarla y no perder tus datos.
        </div>
      )}

      {msg && <div className={'msg ' + msg.type}>{msg.text}</div>}

      <div className="tabs">
        {tabs.map(([id, label]) => (
          <button key={id} className={'tab ' + (tab === id ? 'active' : '')} onClick={() => setTab(id)}>{label}</button>
        ))}
      </div>

      {/* INICIO */}
      {tab === 'home' && (
        <div>
          <div className="field">
            <label>Importe (€)</label>
            <input type="number" inputMode="decimal" step="0.01" placeholder="0.00"
              value={form.amount} onChange={e => setForm({ ...form, amount: e.target.value })} />
          </div>
          <div className="field">
            <label>Categoría</label>
            <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>
              <option value="">Selecciona una categoría</option>
              {data.categories.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Fecha</label>
            <input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} />
          </div>
          <div className="field">
            <label>Nota (opcional)</label>
            <textarea placeholder="Detalles del gasto" value={form.note}
              onChange={e => setForm({ ...form, note: e.target.value })} />
          </div>
          <button className="btn" onClick={addExpense}>Agregar gasto</button>
        </div>
      )}

      {/* CATEGORÍAS */}
      {tab === 'categories' && (
        <div>
          <div className="field">
            <label>{catForm.id ? 'Editar categoría' : 'Nueva categoría'}: nombre</label>
            <input type="text" placeholder="Ej: Comida" value={catForm.name}
              onChange={e => setCatForm({ ...catForm, name: e.target.value })} />
          </div>
          <div className="field">
            <label>Presupuesto mensual (€)</label>
            <input type="number" inputMode="decimal" step="0.01" placeholder="0.00" value={catForm.budget}
              onChange={e => setCatForm({ ...catForm, budget: e.target.value })} />
          </div>
          <button className="btn" onClick={saveCategory}>{catForm.id ? 'Guardar cambios' : 'Crear categoría'}</button>
          {catForm.id && (
            <button className="btn btn-sec" style={{ marginTop: 8 }}
              onClick={() => setCatForm({ id: null, name: '', budget: '' })}>Cancelar edición</button>
          )}

          <h3 className="section-title">Categorías actuales</h3>
          {data.categories.map(c => (
            <div key={c.id} className="row">
              <div className="row-info">
                <div className="row-title">{c.name}</div>
                <div className="row-sub">Presupuesto: €{c.budget.toFixed(2)}</div>
              </div>
              <div className="actions">
                <button className="btn btn-sec btn-small"
                  onClick={() => setCatForm({ id: c.id, name: c.name, budget: String(c.budget) })}>Editar</button>
                <button className="btn btn-danger btn-small" onClick={() => deleteCategory(c)}>Eliminar</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ESTADÍSTICAS */}
      {tab === 'stats' && (
        <div>
          <div className="cards">
            <div className="card">
              <h3>Gastado este mes</h3>
              <div className="value">€{totalNow.toFixed(2)}</div>
            </div>
            <div className="card">
              <h3>Mes anterior</h3>
              <div className="value">€{totalPrev.toFixed(2)}</div>
            </div>
            <div className="card">
              <h3>Variación</h3>
              <div className="value">{diff === null ? '—' : (diff > 0 ? '+' : '') + diff.toFixed(0) + '%'}</div>
            </div>
          </div>

          <h3 className="section-title">Presupuesto del mes ({thisMonth})</h3>
          {data.categories.map(c => {
            const spent = spentByCat(thisMonth)[c.name] || 0;
            const pct = c.budget > 0 ? Math.min(100, (spent / c.budget) * 100) : 0;
            const over = c.budget > 0 && spent > c.budget;
            return (
              <div key={c.id} className="row" style={{ display: 'block' }}>
                <div className="row-title">{c.name} {over && '⚠️'}</div>
                <div className="row-sub">€{spent.toFixed(2)} de €{c.budget.toFixed(2)}</div>
                <div className="bar"><div className={over ? 'over' : ''} style={{ width: pct + '%' }}></div></div>
              </div>
            );
          })}

          <h3 className="section-title">Últimos meses</h3>
          {monthKeys.length === 0 && <div className="empty">Aún no hay gastos</div>}
          {monthKeys.map(k => (
            <div key={k} className="row" style={{ display: 'block' }}>
              <div className="row-title">{k} · €{monthlyTotals[k].toFixed(2)}</div>
              <div className="bar"><div style={{ width: (monthlyTotals[k] / maxMonth) * 100 + '%' }}></div></div>
            </div>
          ))}

          <button className="btn" style={{ marginTop: 16 }} onClick={exportCSV}>📥 Descargar CSV</button>
        </div>
      )}

      {/* HISTORIAL */}
      {tab === 'history' && (
        <div>
          <h3 className="section-title">Todos los gastos ({data.expenses.length})</h3>
          {data.expenses.length === 0 && <div className="empty">No hay gastos registrados</div>}
          {data.expenses.map(e => (
            <div key={e.id} className="row">
              <div className="row-info">
                <div className="row-sub">{e.date} · {e.category}</div>
                <div className="amount">€{e.amount.toFixed(2)}</div>
                {e.note && <div className="row-sub">{e.note}</div>}
              </div>
              <button className="btn btn-danger btn-small" onClick={() => deleteExpense(e.id)}>Eliminar</button>
            </div>
          ))}
        </div>
      )}

      {/* COPIA */}
      {tab === 'backup' && (
        <div>
          <p className="muted" style={{ marginBottom: 14 }}>
            Tus datos se guardan en este navegador. Si borras los datos del navegador o cambias de móvil, los perderás.
            Descarga una copia de seguridad de vez en cuando y guárdala en un lugar seguro (Drive, correo, etc.).
          </p>
          <p style={{ marginBottom: 14 }}>
            <strong>Última copia:</strong> {lastBackup ? new Date(lastBackup).toLocaleString('es-ES') : 'nunca'}
          </p>

          <button className="btn" onClick={exportBackup}>💾 Descargar copia de seguridad</button>

          <h3 className="section-title">Restaurar una copia</h3>
          <button className="btn btn-sec" onClick={() => mergeInput.current.click()}>
            Restaurar y combinar con los datos actuales
          </button>
          <button className="btn btn-danger" style={{ marginTop: 8 }} onClick={() => replaceInput.current.click()}>
            Restaurar y sustituir todos los datos
          </button>
          <input ref={mergeInput} type="file" accept="application/json,.json" style={{ display: 'none' }}
            onChange={e => onPickFile(e, false)} />
          <input ref={replaceInput} type="file" accept="application/json,.json" style={{ display: 'none' }}
            onChange={e => onPickFile(e, true)} />
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
